; Per-site PHP limits, honoured by Apache/FastCGI but NOT by Valet, which serves this site
; through a front controller outside the application; there the limits live in the nginx server
; block (see docs/video-operations.md).
;
; These ceilings must clear the video-lecture limit (VIDEO_MAX_KILOBYTES, 500 MB by default) or
; every lecture upload fails before reaching PHP. Raising them does NOT raise the 10 MB study
; material limit: that is enforced in the application by UploadMaterialRequest, ReplaceMaterialRequest
; and App\Rules\StudyMaterialFile, independently of what PHP will accept.
upload_max_filesize=500M
post_max_size=512M
